server:
  port: 8761

spring:
  application:
    name: eureka-server
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
    bootstrap:
      enabled: true   # ← this line replaces the need for bootstrap.yml and config loads first

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false